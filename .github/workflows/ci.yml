name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [unit, race, proto]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.3'
          cache: true
      - if: matrix.check == 'proto'
        run: bash scripts/ci-tools.sh proto
      - run: bash scripts/ci-check.sh "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: isolated-integration-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.3'
      - run: bash scripts/ci-check.sh integration
