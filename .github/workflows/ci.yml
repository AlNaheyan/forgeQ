name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [unit, race, proto]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true
      - if: matrix.check == 'proto'
        run: bash scripts/ci-tools.sh proto
      - if: matrix.check == 'unit'
        run: |
          python3 scripts/ci-check-test.py
          python3 scripts/ci-scan-test.py
          python3 scripts/ci-publish-test.py
          python3 scripts/release-manifest-test.py
          python3 scripts/release-install-test.py
      - run: bash scripts/ci-check.sh "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: isolated-integration-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
      - run: bash scripts/ci-check.sh integration
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
      - run: bash scripts/ci-tools.sh scan
      - run: python3 scripts/ci-check-test.py && python3 scripts/ci-scan-test.py
      - run: python3 scripts/ci-secret-fixture.py
      - run: python3 scripts/ci-scan.py secrets --output artifacts/scans
      - run: python3 scripts/ci-scan.py dependencies --output artifacts/scans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-inventory
          path: artifacts/scans
          if-no-files-found: error
          retention-days: 14
  image-archive:
    needs: [checks, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
      - run: bash scripts/ci-tools.sh scan
      - run: python3 scripts/release-manifest-test.py
      - run: bash scripts/ci-release-build.sh "$RUNNER_TEMP/release"
      - run: python3 scripts/release-manifest.py load "$RUNNER_TEMP/release" --manifest-sha256 "$(sha256sum "$RUNNER_TEMP/release/manifest.json" | cut -d' ' -f1)"
