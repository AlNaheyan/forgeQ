name: Approved release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tested revision and independent environment approval
        run: python3 scripts/ci-publish-guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
      - run: bash scripts/ci-tools.sh scan
      - run: python3 scripts/ci-scan.py secrets --output artifacts/scans
      - run: python3 scripts/ci-scan.py dependencies --output artifacts/scans
      - name: Build exact release
        run: bash scripts/ci-release-build.sh "$RUNNER_TEMP/release"
        env:
          GO_IMAGE: ${{ vars.RELEASE_GO_IMAGE }}
          RUNTIME_IMAGE: ${{ vars.RELEASE_RUNTIME_IMAGE }}
      - name: Verify archive installation
        run: python3 scripts/release-manifest.py load "$RUNNER_TEMP/release" --manifest-sha256 "$(sha256sum "$RUNNER_TEMP/release/manifest.json" | cut -d' ' -f1)"
      - name: Publish approved images
        run: python3 scripts/ci-publish.py "$RUNNER_TEMP/release"
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          RELEASE_NAMESPACE: ${{ vars.RELEASE_NAMESPACE }}
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
