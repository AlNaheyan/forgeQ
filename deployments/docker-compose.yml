services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgequeue
      POSTGRES_USER: forgequeue
      POSTGRES_PASSWORD: forgequeue
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequeue -d forgequeue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://forgequeue:forgequeue@postgres:5432/forgequeue?sslmode=disable
      REDIS_ADDR: redis:6379
      COORDINATOR_ADDR: coordinator:9090
      MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-100000}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: coordinator
    environment:
      APP_ENV: development
      GRPC_PORT: 9090
      DATABASE_URL: postgres://forgequeue:forgequeue@postgres:5432/forgequeue?sslmode=disable
      REDIS_ADDR: redis:6379
      HEARTBEAT_INTERVAL: 5s
      WORKER_TIMEOUT: 15s
      LEASE_DURATION: 30s
      LEASE_SCAN_INTERVAL: 1s
      RETRY_BASE_DELAY: 2s
      RETRY_MAX_DELAY: 60s
      RETRY_PROMOTION_INTERVAL: 250ms
      SCHEDULER_STRATEGY: least_loaded
      METRICS_PORT: 9101
      LOG_LEVEL: info
    ports:
      - "9090:9090"
    expose:
      - "9101"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      coordinator:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    environment:
      APP_ENV: development
      COORDINATOR_ADDR: coordinator:9090
      WORKER_CONCURRENCY: 4
      WORKER_JOB_TYPES: sleep,fail
      LEASE_RENEW_INTERVAL: 10s
      LOG_LEVEL: info
    depends_on:
      coordinator:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
