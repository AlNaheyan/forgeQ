global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: forgequeue-api
    scheme: https
    static_configs:
      - targets: ['api:8080']
    authorization:
      credentials_file: /run/forgeq/api-operator-key
    tls_config:
      ca_file: /run/forgeq/api-ca.crt
      server_name: api
  - job_name: forgequeue-coordinator
    scheme: https
    static_configs:
      - targets: ['coordinator:9101']
    authorization:
      credentials_file: /run/forgeq/metrics-token
    tls_config:
      ca_file: /run/forgeq/metrics-ca.crt
      server_name: coordinator
