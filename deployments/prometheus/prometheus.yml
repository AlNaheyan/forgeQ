global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: forgequeue-api
    authorization:
      credentials_file: /etc/forgequeue/secrets/prometheus-api-key
    static_configs:
      - targets: ["api:8080"]
  - job_name: forgequeue-coordinator
    static_configs:
      - targets: ["coordinator:9101"]
