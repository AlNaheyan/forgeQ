global:
  resolve_timeout: 5m

route:
  receiver: forgequeue-local-mock
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: forgequeue-local-mock
      repeat_interval: 1h

receivers:
  - name: forgequeue-local-mock
    webhook_configs:
      - url: http://host.docker.internal:8088/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, job]
