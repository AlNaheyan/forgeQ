# Disposable test dependencies. Never merge with the development Compose file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgequeue_recovery
      POSTGRES_USER: forgequeue
      POSTGRES_PASSWORD: recovery-test-only
    ports:
      - "127.0.0.1:${FORGEQUEUE_RECOVERY_POSTGRES_PORT:?run scripts/test-recovery.sh}:5432"
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - recovery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequeue -d forgequeue_recovery"]
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${FORGEQUEUE_RECOVERY_REDIS_PORT:?run scripts/test-recovery.sh}:6379"
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  recovery-postgres:
